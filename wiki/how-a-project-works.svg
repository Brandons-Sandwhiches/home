<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Segoe UI, system-ui, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>How a project works with home</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6876"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f6f7f9"/>
  <text x="24" y="36" font-size="22" font-weight="700" fill="#17212b">How a project works</text>
  <text x="24" y="58" fill="#5b6876">Home holds the tools. Each project holds its own knowledge and tasks. The work folder shows them all.</text>

  <!-- home -->
  <rect x="24" y="84" width="260" height="196" rx="8" fill="#dce9f3" stroke="#1f5f8b"/>
  <text x="40" y="110" font-weight="700" fill="#1f5f8b">home (generic, shared)</text>
  <text x="40" y="136" fill="#17212b">skills: wiki, learn-from-work,</text>
  <text x="40" y="154" fill="#17212b">  agent-review, ecrs-review,</text>
  <text x="40" y="172" fill="#17212b">  discovery-interview</text>
  <text x="40" y="196" fill="#17212b">templates/project, templates/work</text>
  <text x="40" y="220" fill="#17212b">scripts/dashboard.py</text>
  <text x="40" y="244" fill="#17212b">evals/run.py, catalog</text>
  <text x="40" y="268" fill="#5b6876" font-size="12">changes only by branch, evals, owner's yes</text>

  <rect x="24" y="296" width="260" height="96" rx="8" fill="#f7e3cf" stroke="#c2620f"/>
  <text x="40" y="322" font-weight="700" fill="#c2620f">private repo (personal)</text>
  <text x="40" y="346" fill="#17212b">user rules: tone, autonomy, session</text>
  <text x="40" y="364" fill="#17212b">  start and end, sign-off tag</text>
  <text x="40" y="382" fill="#17212b">golden tasks, decisions</text>

  <!-- tools -->
  <rect x="330" y="150" width="190" height="170" rx="8" fill="#ffffff" stroke="#5b6876"/>
  <text x="346" y="176" font-weight="700" fill="#17212b">Every tool, same way</text>
  <text x="346" y="202" fill="#17212b">Claude Code</text>
  <text x="346" y="224" fill="#17212b">Codex</text>
  <text x="346" y="246" fill="#17212b">opencode</text>
  <text x="346" y="274" fill="#5b6876" font-size="12">reads AGENTS.md, the user</text>
  <text x="346" y="290" fill="#5b6876" font-size="12">rules and the linked skills</text>
  <path d="M284,190 L326,210" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M284,340 L326,280" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="288" y="232" fill="#5b6876" font-size="12">skillshare</text><text x="288" y="248" fill="#5b6876" font-size="12">links</text>

  <!-- project -->
  <rect x="566" y="84" width="370" height="330" rx="8" fill="#dcefe3" stroke="#2d7a4b"/>
  <text x="582" y="110" font-weight="700" fill="#2d7a4b">a project (copied from the template)</text>
  <text x="582" y="136" fill="#17212b">AGENTS.md: the map and habits, 60 lines max</text>
  <text x="582" y="160" fill="#17212b">backlog/: To Do, In Progress, Done</text>
  <text x="582" y="184" fill="#17212b">raw/ (sources) to wiki/ (pages, lessons)</text>
  <text x="582" y="208" fill="#17212b">archive/: old parts move here, never deleted</text>
  <rect x="582" y="226" width="338" height="176" rx="6" fill="#ffffff" stroke="#2d7a4b"/>
  <text x="598" y="250" font-weight="700" fill="#17212b">Each session</text>
  <text x="598" y="276" fill="#17212b">1. Start: where we left off + next 3 tasks</text>
  <text x="598" y="300" fill="#17212b">2. One task. Drops go to the wiki now;</text>
  <text x="598" y="318" fill="#17212b">   corrections become lessons</text>
  <text x="598" y="342" fill="#17212b">3. repo-check, a quick separate review</text>
  <text x="598" y="366" fill="#17212b">4. End: update backlog, tag needs-you,</text>
  <text x="598" y="384" fill="#17212b">   log skills, rebuild the dashboard</text>
  <path d="M520,235 L562,235" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="522" y="226" fill="#5b6876" font-size="12">works in</text>

  <!-- work -->
  <rect x="330" y="470" width="606" height="140" rx="8" fill="#ffffff" stroke="#1f5f8b"/>
  <text x="346" y="496" font-weight="700" fill="#1f5f8b">work folder: the home base</text>
  <text x="346" y="522" fill="#17212b">Ask "what's up" in any tool, or open dashboard.html</text>
  <rect x="346" y="536" width="180" height="58" rx="6" fill="#f7e3cf"/><text x="360" y="560" font-weight="700" fill="#17212b">Needs you</text><text x="360" y="580" fill="#5b6876" font-size="12">one sign-off list</text>
  <rect x="540" y="536" width="180" height="58" rx="6" fill="#dcefe3"/><text x="554" y="560" font-weight="700" fill="#17212b">Active</text><text x="554" y="580" fill="#5b6876" font-size="12">left off, next 3</text>
  <rect x="734" y="536" width="186" height="58" rx="6" fill="#eef1f4"/><text x="748" y="560" font-weight="700" fill="#17212b">Parked</text><text x="748" y="580" fill="#5b6876" font-size="12">idle 30+ days, archive?</text>
  <path d="M750,414 L750,466" stroke="#5b6876" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <text x="758" y="446" fill="#5b6876" font-size="12">dashboard.py reads every backlog</text>
</svg>
