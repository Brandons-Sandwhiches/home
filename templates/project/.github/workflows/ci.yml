# Tiny CI: gitleaks, then the project's own check (repo-check). No LLM step.
# Job names stay stable so a ruleset can require them.
# `lint` runs only the checks the repo carries: the wiki lint and STE prose check
# run when home sits next to the repo (the lint job clones it), else repo-check skips them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.24.2"
  GITLEAKS_SHA256: "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e"

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          # A PR scans its own commits. A push to main scans the history of main.
          # A rotated secret in old history goes in .gitleaksignore as a fingerprint.
          if [ "$EVENT" = "pull_request" ]; then range="origin/${BASE}..HEAD"; else range="HEAD"; fi
          gitleaks git --no-banner --redact --log-opts="$range" .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          sudo tar -xzf gitleaks.tgz -C /usr/local/bin gitleaks
      - name: Fetch home for the wiki lint and STE prose check
        if: github.event.repository.name != 'home'
        run: git clone --depth 1 "https://github.com/${{ github.repository_owner }}/home.git" ../home || echo "home not reachable, those two checks are skipped"
      - run: python3 scripts/repo-check.py
